<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restablecer contrasena | CQB Factory</title>
    <meta
      name="description"
      content="Actualiza tu contrasena para volver a ingresar a CQB Factory."
    />
    <link rel="canonical" href="https://cqbfactory.com/reset-password.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="noise"></div>
    <header class="site-header">
      <div class="brand">CQB FACTORY</div>
      <nav class="top-tabs">
        <a class="top-tab-link" href="/?tab=partidas">Volver a Partidas</a>
      </nav>
    </header>

    <main>
      <section class="section account-layout">
        <article class="auth-box">
          <div class="section-head compact">
            <p class="eyebrow">Recuperacion</p>
            <h1>Restablecer contrasena</h1>
          </div>

          <p class="hero-copy">
            Define una nueva contrasena para tu cuenta. El enlace vence en 30 minutos.
          </p>

          <form id="reset-password-form" class="auth-form hidden">
            <label>
              Nueva contrasena
              <input id="new-password" type="password" minlength="6" required />
            </label>
            <label>
              Repite la contrasena
              <input id="confirm-password" type="password" minlength="6" required />
            </label>
            <button class="btn btn-primary" type="submit">Actualizar contrasena</button>
          </form>

          <p id="reset-password-message" class="message"></p>
        </article>
      </section>
    </main>

    <script src="reset-password.js"></script>
  </body>
</html>
